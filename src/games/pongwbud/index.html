// file: ball.ms
function()
ball = object
  r = random.nextInt(360)
  x = 0 y = 0
  w = 15 h = 15
  spd = 3
end

resetBall = function()
  ball.r = random.nextInt(360)
  ball.x = 0 ball.y = 0
end

local vBounce = function()
  ball.r = 180 - ball.r + random.nextInt(21) - 10
end

local hBounce = function()
  ball.r = -ball.r + random.nextInt(21) - 10
end

ball.move = function()
  ball.x += sind(ball.r) * ball.spd + v
  ball.y += cosd(ball.r) * ball.spd + v

  local screenLower = -100 + ball.h / 2
  local screenUpper = 100 - ball.h / 2
  
  if clamp(ball.y, screenLower, screenUpper) == screenLower or
     clamp(ball.y, screenLower, screenUpper) == screenUpper then
    vBounce()
  end
  
  if checkCollisions(ball, plr1) or checkCollisions(ball, plr2) then
    hBounce()
  end
end
end()



// file: buttons.ms
function()
Button = class
  constructor = function(x, y, w, h, t, ts, c1, c2)
    this.x = x
    this.y = y
    this.w = w
    this.h = h
    this.t = t
    this.ts = ts
    this.c1 = c1
    this.c2 = c2
  end
end

drawBtn = function(btn)
  screen.setLineDash([0,0])
  screen.setLineWidth(2)
  screen.drawRect(btn.x,btn.y,btn.w,btn.h,btn.c2)
  screen.fillRect(btn.x,btn.y,btn.w,btn.h,btn.c1)
  
  screen.drawText(btn.t,btn.x,btn.y,btn.ts,btn.c2)
end

startBtns = []
startBtns.push(new Button(0, -20, 60, 15, "PLAY", 12, "#444", "#AAA"))
startBtns.push(new Button(0, -40, 60, 15, "KEYBINDS", 12, "#444", "#AAA"))
  
gameBtns = []
gameBtns.push(new Button(-20, 90, 30, 10, "HOME", 8, "#444", "#AAA"))
gameBtns.push(new Button(20, 90, 30, 10, "RESET", 8, "#444", "#AAA"))

btnLogic = function()
  if not startGame then
    if keyboard.press.SPACE then
      startGame = true
      ball.r = random.nextInt(360)
      ball.x = 0 ball.y = 0
    end
    if keyboard.press.K then
      if not showKeybinds then
        showKeybinds = true
      else
        showKeybinds = false
      end
    end
  else
    if keyboard.press.R then
      resetGame()
    end
    if keyboard.press.ESCAPE then
      startGame = false
    end
  end

  if mouse.left and mouse.press then
    if not startGame then
      if mouseIsIn(startBtns[0]) then
        startGame = true
        resetGame()
      end
      if mouseIsIn(startBtns[1]) then
        if not showKeybinds then
          showKeybinds = true
        else
          showKeybinds = false
        end
      end
    else
      if mouseIsIn(gameBtns[0]) then
        startGame = false
      end
      if mouseIsIn(gameBtns[1]) then
        resetGame()
      end
    end
  end
end
end()



// file: main.ms
function()
init = function()
  startGame = false
  showKeybinds = false

  resetGame = function()
    resetBall()
    plr1.score = 0 plr2.score = 0
  end
end

update = function()
  if startGame then
    ball.move()
    plr1.move()
    plr2.move()
  end
  
  btnLogic()

  if ball.x > 140 then
    plr1.score += 1
    resetBall()
  elsif ball.x < -140 then
    plr2.score += 1
    resetBall()
  end
end

draw = function()
  screen.clear("#111")
  
  if startGame then
    screen.setLineDash([15,8])
    screen.drawLine(0,100,0,-100,"#FFF")
    
    screen.drawText("PLAYER 1", -70, 82, 12, "#AAA")
    screen.drawText(plr1.score, -70, 68, 16,)
    screen.drawText("PLAYER 2", 70, 82, 12)
    screen.drawText(plr2.score, 70, 68, 16)
    
    screen.fillRect(ball.x,ball.y,ball.w,ball.h,"#FFF")
    drawPlayer(plr1)
    drawPlayer(plr2)
    
    for btn in gameBtns
      drawBtn(btn)
    end
  else
    for btn in startBtns
      drawBtn(btn)
    end
    
    screen.drawTextOutline("PONG W/ UR BUD", 0, 50, 30, "#AAA")
    screen.drawText("PONG W/ UR BUD", 0, 50, 30, "#444")
    screen.drawText("Prerequisites:", 0, 25, 10, "#AAA")
    screen.drawText("A keyboard and a bud", 0, 14, 8)
    
    if showKeybinds then
      screen.drawRect(80, -35, 80, 60, "#AAA")
      screen.fillRect(80, -35, 80, 60, "#444")
      
      screen.drawText("- SPACE = PLAY BUTTON", 80, -12, 7, "#AAA")
      screen.drawText("- ESCAPE = HOME BUTTON", 80, -19, 7)
      screen.drawText("- R = RESET BUTTON", 80, -26, 7)
      screen.drawText("- K = KEYBINDS BUTTON", 80, -33, 7)
      screen.drawText("- W, S = PLAYER 1", 80, -40, 7)
      screen.drawText("- ARROWS = PLAYER 2", 80, -47, 7)
      screen.drawText("[ click again to exit ]", 80, -57, 7)
    end  
  end
end
end()



// file: physics.ms
function()
clamp = function(val, lower, upper)
  return min(max(val, lower), upper)
end

checkCollisions = function(obj1, obj2)
  return obj1.x + obj1.w / 2 > obj2.x - obj2.w / 2 and
         obj1.x - obj1.w / 2 < obj2.x + obj2.w / 2 and
         obj1.y + obj1.h / 2 > obj2.y - obj2.h / 2 and
         obj1.y - obj1.h / 2 < obj2.y + obj2.h / 2
end

mouseIsIn = function(obj)
  return mouse.x > obj.x - obj.w / 2 and
         mouse.x < obj.x + obj.w / 2 and
         mouse.y > obj.y - obj.h / 2 and
         mouse.y < obj.y + obj.h / 2
end
end()



// file: players.ms
function()
Player = class
  constructor = function(x, y, w, h)
    this.x = x
    this.y = y
    this.w = w
    this.h = h
    this.spd = ball.spd
    this.score = 0
  end
end

plr1 = new Player(-120, 0, 10, 40)
plr2 = new Player(120, 0, 10, 40)

plr1.move = function()
  if keyboard.W then
    plr1.y += plr1.spd
  elsif keyboard.S then
    plr1.y -= plr1.spd
  end

  plr1.y = clamp(plr1.y, -100 + plr1.h / 2, 100 - plr1.h / 2)
end

plr2.move = function()
  if keyboard.ARROW_UP then
    plr2.y += plr2.spd
  elsif keyboard.ARROW_DOWN then
    plr2.y -= plr2.spd
  end

  plr2.y = clamp(plr2.y, -100 + plr2.h / 2, 100 - plr2.h / 2)
end

drawPlayer = function(plr)
  screen.fillRect(plr.x, plr.y, plr.w, plr.h, "#FFF")
end
end()
